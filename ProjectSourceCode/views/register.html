
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Register - Game Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <main id="register-screen" class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="register-card">

            <header id="register-header">
                <h1 id="game-title">Geo Game</h1>
                <h2>Create Account</h2>
            </header>

            <form id="register-form" action="/register" method="POST">

                <div class="field mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input id="username" name="username" type="text" class="form-control" placeholder="Enter username" autocomplete="username" minlength="3" maxlength="20" required>
                </div>

                <div class="field mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input id="password" name="password" type="password" class="form-control" placeholder="Enter password" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="field mb-4">
                    <label for="confirm" class="form-label">Confirm password</label>
                    <input id="confirm" name="confirm" type="password" class="form-control" placeholder="Confirm password" autocomplete="new-password" minlength="8" required>
                </div>

                <button id="btn-register" type="submit" class="btn btn-primary w-100">Register</button>
            </form>

            <nav id="register-links" class="text-center mt-4" aria-label="Account links">

                <p>Already have an account? <a href="login.html">Log in</a> </p>
                <p> <a href="start-screen.html">Back to start screen</a> </p>

            </nav>
        </div>
    </main>
</body>
</html>
