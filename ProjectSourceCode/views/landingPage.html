
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Game</title>

    <style>
        body {
            background-color: #e5e5e5;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }

        .menu {
            position: absolute;
            top: 15px;
            left: 15px;
            border: 2px solid black;
            border-radius: 50%;
            padding: 15px;
            font-size: 24px;
        }

        h1 {
            font-size: 100px;
            font-weight: normal;
            margin-top: 30px;
            margin-bottom: 0;
        }

        .play {
            border: 2px solid black;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            margin: 180px auto 70px;
            font-size: 70px;
            line-height: 120px;
        }

        .buttons {
            display: flex;
            justify-content: space-evenly;
        }

        .button {
            border: 2px solid black;
            padding: 20px 40px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <div class="menu">⋮</div>

    <h1>GEO<br>GAME</h1>

    <div class="play">▶</div>

    <div class="buttons">
        <div class="button">Levels</div>
        <div class="button">Shop</div>
        <div class="button">Profile</div>
    </div>

</body>
</html>
