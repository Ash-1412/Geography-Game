<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Choose an Answer - Game Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
</head>

<body>

    <main id="question-screen" class="container py-5 d-flex align-items-center justify-content-center">

        <div class="login-card">

            <header id="question-header" class="text-center mb-4">
                <h1 id="game-title">Game Title</h1>
                <h2 id="question-text">What is the capital of France?</h2>
            </header>

            <form id="options-form" action="/answer" method="POST">

                <div class="d-grid gap-3">
                    <button type="submit" name="choice" value="Paris" class="btn btn-outline-primary btn-lg option-btn">Country</button>
                    <button type="submit" name="choice" value="Rome" class="btn btn-outline-primary btn-lg option-btn">Country</button>
                    <button type="submit" name="choice" value="Madrid" class="btn btn-outline-primary btn-lg option-btn">Country</button>
                    <button type="submit" name="choice" value="Berlin" class="btn btn-outline-primary btn-lg option-btn">Country</button>
                </div>

            </form>

            <nav id="question-links" class="text-center mt-4" aria-label="Game links">
                <p><a href="landingPage.html">Back to start screen</a></p>
            </nav>

        </div>

    </main>

</body>
</html>
