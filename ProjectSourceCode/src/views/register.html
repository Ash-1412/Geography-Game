<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Game - Register</title>
    <style>
        body {
            background-color: #d9eee7;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 30px 15px;
            color: #163e40;
        }

        .register-box {
            background-color: #fffdf5;
            border: 2px solid #163e40;
            border-radius: 15px;
            max-width: 400px;
            padding: 30px;
            margin: 30px auto;
            box-shadow: 6px 6px #9fcac0;
        }

        h1, h2, .intro, .links {
            text-align: center;
        }

        h1 {
            font-size: 42px;
            margin: 10px 0;
        }

        h2 {
            margin-bottom: 10px;
        }

        .compass {
            text-align: center;
            font-size: 40px;
            color: #138077;
        }

        .intro {
            color: #54736e;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin: 15px 0 5px;
            font-weight: bold;
        }

        input {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            border: 1px solid #9cbeb4;
            border-radius: 6px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background-color: #138077;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d615b;
        }

        a {
            color: #138077;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <div class="compass">✦</div>
        <h1>GEO GAME</h1>
        <h2>Create an Account</h2>
        <p class="intro">Your adventure around the world starts here!</p>

        <form action="/register" method="POST">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" minlength="8" required>

            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" name="confirm-password" required>

            <button type="submit">Start Exploring!</button>
        </form>

        <div class="links">
            <p>Already have an account? <a href="login.html">Log in</a></p>
            <a href="index.html">Back to Start</a>
        </div>
    </div>
</body>
</html>
