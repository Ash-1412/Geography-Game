
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Log In - Game Title</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../resources/css/styles.css">
</head>

<body>

    <main id="login-screen" class="container min-vh-100 d-flex align-items-center justify-content-center">

        <div class="login-card">

            <header id="login-header">
                <h1 id="game-title">Geo Game</h1>
                <h2>Log In</h2>
            </header>

            <p id="login-error" class="alert alert-danger" role="alert" hidden></p>

            <form id="login-form" action="/login" method="POST">

                <div class="field mb-3">
                    <label for="username" class="form-label">
                        Username
                    </label>
                    <input id="username" name="username" type="text" class="form-control" placeholder="Enter username" autocomplete="username" required>
                </div>

                <div class="field mb-3">
                    <label for="password" class="form-label">
                        Password
                    </label>
                    <input id="password" name="password" type="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
                </div>

                <div class="field form-check mb-3">
                    <input id="remember" name="remember" type="checkbox" class="form-check-input">
                    <label for="remember" class="form-check-label">
                        Remember me
                    </label>
                </div>

                <button id="btn-login" type="submit" class="btn btn-primary w-100"> Log In</button>

            </form>

            <nav id="login-links" class="text-center mt-4" aria-label="Account links">

                <p><a href="forgot-password.html">Forgot your password?</a></p>
                <p><a href="register.html">Don't have an account?</a></p>
                <p><a href="start-screen.html">Back to start screen</a></p>

            </nav>

        </div>

    </main>

</body>
</html>
