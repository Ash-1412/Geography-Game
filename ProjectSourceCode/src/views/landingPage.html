<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Game</title>

    <style>
        body {
            background-color: #e5e5e5;
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
        }

        /* Make all the links look like the original boxes, not blue underlined text */
        a {
            color: inherit;
            text-decoration: none;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }

        a:hover {
            background-color: #d0d0d0;
        }

        a:active {
            transform: scale(0.97);
        }

        a:focus-visible {
            outline: 3px solid #3b6df0;
            outline-offset: 2px;
        }

        .menu {
            position: absolute;
            top: 15px;
            left: 15px;
            border: 2px solid black;
            border-radius: 50%;
            padding: 15px;
            font-size: 24px;
        }

        h1 {
            font-size: 100px;
            font-weight: normal;
            margin-top: 30px;
            margin-bottom: 0;
        }

        .play {
            display: block;
            border: 2px solid black;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            margin: 180px auto 70px;
            font-size: 70px;
            line-height: 120px;
        }

        .buttons {
            display: flex;
            justify-content: space-evenly;
        }

        .button {
            border: 2px solid black;
            padding: 20px 40px;
            font-size: 30px;
        }
    </style>
</head>

<body>

    <a class="menu" href="#" aria-label="Menu">⋮</a>

    <h1>GEO<br>GAME</h1>

    <a class="play" href="activeGame.html" aria-label="Play">▶</a>

    <div class="buttons">
        <a class="button" href="levels.html">Levels</a>
        <a class="button" href="shop.html">Shop</a>
        <a class="button" href="profile.html">Profile</a>
    </div>

</body>
</html>
