services:
  db:
    image: postgres:18
    env_file: ./.env
    ports:
      - '5432:5432'
    volumes:
      - Geogame_data:/var/lib/postgresql
      - ./src/init_data/create.sql:/docker-entrypoint-initdb.d/create.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:lts
    user: 'node'
    working_dir: /home/node/app
    env_file: ./.env
    environment:
      - NODE_ENV=development
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '3000:3000'
    volumes:
      - ./:/home/node/app
    command: sh -c "npm install && npm start"

volumes:
  Geogame_data: